name: Pipeline CI/CD Tech Challenge 3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push das imagens no Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          services=("auth-service" "analytics-service" "evaluation-service" "flag-service" "targeting-service")
          
          for service in "${services[@]}"; do
            echo "Building $service..."
            docker build -t $ECR_REGISTRY/$service:latest ./$service
            docker push $ECR_REGISTRY/$service:latest
          done

      - name: Deploy no Cluster EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name techchallenge-eks

          # Criando a namespace techchallenge
          kubectl create namespace techchallenge --dry-run=client -o yaml | kubectl apply -f -

          # Instalando o Argo CD no CLuster
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          # Aplicando os manifestos
          kubectl apply -f k8s/