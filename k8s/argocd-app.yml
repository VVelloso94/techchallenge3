apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techchallenge-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/VVelloso94/techchallenge3.git'
    targetRevision: HEAD
    path: 'k8s'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: techchallenge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true