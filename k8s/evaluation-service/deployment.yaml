apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: techchallenge
  labels:
    app: evaluation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
        - name: evaluation-service
          image: 109420432998.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:47ae4571c451b2a2889e4770ba1627ee51c6be0f
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-service-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8080
            - name: FLAG_SERVICE_URL
              value: http://flag-service:5000
            - name: TARGETING_SERVICE_URL
              value: http://targeting-service:5001
            - name: REDIS_URL
              value: "redis://evaluation-redis.txqavo.0001.use1.cache.amazonaws.com:6379"
            - name: OTEL_SERVICE_NAME
              value: "evaluation-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.techchallenge.svc.cluster.local:4317"