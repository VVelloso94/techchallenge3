apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: techchallenge
  labels:
    app: flag-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 109420432998.dkr.ecr.us-east-1.amazonaws.com/flag-service:dfe81da6eb3e76a356df55fec8eb3c153c24181e
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: flag-service-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_FLAG_URL
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8080
            - name: OTEL_SERVICE_NAME
              value: "flag-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "https://otlp.nr-data.net:4317" #
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "api-key=3bfc814683918ce8184a3fb68f525a68bd37NRAL"
