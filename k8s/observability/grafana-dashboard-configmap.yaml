apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-techchallenge-health
  namespace: techchallenge
  labels:
    grafana_dashboard: "1"
data:
  techchallenge-health.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(container_cpu_usage_seconds_total{namespace=\"techchallenge\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "title": "Real-Time Pod Logs (Loki)",
          "type": "logs",
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{namespace=\"techchallenge\"}"
            }
          ]
        }
      ],
      "schemaVersion": 38,
      "title": "TechChallenge - Ecosystem Health",
      "refresh": "10s"
    }