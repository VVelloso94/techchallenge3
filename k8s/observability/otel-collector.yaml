apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: techchallenge
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
      otlp_http/loki:
        endpoint: "http://loki.techchallenge.svc.cluster.local:3100/otlp"

      # Exportador de traces para a New Relic APM
      otlp_grpc/newrelic:
        endpoint: "otlp.nr-data.net:4317"
        headers:
          api-key: "3bfc814683918ce8184a3fb68f525a68bd37NRAL"

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [100us, 1ms, 2ms, 6ms, 10ms, 100ms, 250ms, 1s]

    service:
      pipelines:
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [spanmetrics, otlp_grpc/newrelic]