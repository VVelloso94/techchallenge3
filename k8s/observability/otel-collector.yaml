apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: techchallenge
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
      
      # Exportador de logs para o Loki interno
      otlphttp/loki:
        endpoint: "http://loki.techchallenge.svc.cluster.local:3100"

      # Exportador de traces para a New Relic APM
      otlp/newrelic:
        endpoint: "otlp.nr-data.net:4317"  
        headers:
          api-key: "3bfc814683918ce8184a3fb68f525a68bd37NRAL"

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/loki]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/newrelic]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: techchallenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:latest
        args: ["--config=/etc/otel-collector-config.yaml"]
        volumeMounts:
        - name: config-volume
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8889
          name: prometheus
      volumes:
      - name: config-volume
        configMap:
          name: otel-collector-conf
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: techchallenge
spec:
  selector:
    app: otel-collector
  ports:
  - port: 4317
    targetPort: 4317
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    name: otlp-http
  - port: 8889
    targetPort: 8889
    name: prometheus